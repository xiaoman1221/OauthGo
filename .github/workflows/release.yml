name: Release

# 推送形如 v1.0.0 的版本标签时触发：
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  # 校验版本号格式（vX.Y.Z），不符合则直接失败
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag (vX.Y.Z)
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式不正确：${{ github.ref_name }}，应为 v1.0.0 形式"
            exit 1
          fi
          echo "版本号：${{ github.ref_name }}"

  # 构建前端产物（web/dist），供各平台编译复用
  frontend:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

  # 交叉编译主流系统（Windows / Linux / macOS，amd64 + arm64）
  build:
    needs: [preflight, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, ext: .exe }
          - { os: windows, arch: arm64, ext: .exe }
          - { os: linux,   arch: amd64, ext: '' }
          - { os: linux,   arch: arm64, ext: '' }
          - { os: darwin,  arch: amd64, ext: '' }
          - { os: darwin,  arch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o oauthgo${{ matrix.ext }} .
      - name: Package (binary + web/dist)
        run: |
          mkdir -p _pkg release
          cp oauthgo${{ matrix.ext }} _pkg/
          cp -r web/dist _pkg/web
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq zip >/dev/null 2>&1
            (cd _pkg && zip -qr ../release/oauthgo-${{ matrix.os }}-${{ matrix.arch }}.zip oauthgo.exe web)
          else
            tar -czf release/oauthgo-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C _pkg oauthgo web
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oauthgo-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*

  # 创建 GitHub Release 并附上所有平台的编译产物
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oauthgo-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: oauthgo-*
          generate_release_notes: true

  # 构建多架构 Docker 镜像，发布到 GitHub Container Registry 与 Docker Hub
  docker:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DH_USERNAME != '' && env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USERNAME }}
          password: ${{ env.DH_TOKEN }}
      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oauthgo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/oauthgo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push (Docker Hub)
        if: env.DH_USERNAME != '' && env.DH_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DH_USERNAME }}/oauthgo:${{ github.ref_name }}
            ${{ env.DH_USERNAME }}/oauthgo:latest
          cache-from: type=gha
