<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OauthGo 接口文档 - Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root { --bg: #ffffff; }
    html.dark { --bg: #0a0a0b; }
    html { box-sizing: border-box; overflow-y: scroll; }
    body {
      margin: 0;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .topbar { display: none; }
    /* 深色模式下对 Swagger UI 做整体反色，贴合前端深色主题 */
    html.dark .swagger-ui {
      filter: invert(0.92) hue-rotate(180deg);
    }
    html.dark .swagger-ui .model-box,
    html.dark .swagger-ui img { filter: invert(1) hue-rotate(180deg); }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <noscript>
    <p style="padding:20px;font-family:sans-serif;">
      需要启用 JavaScript 才能查看 Swagger UI。<br>
      也可直接访问
      <a href="/docs/openapi.yaml">/docs/openapi.yaml</a>
      获取 OpenAPI 规范文件，导入 Apifox / Postman 使用。
    </p>
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    // 与前端主题联动
    (function () {
      function applyTheme() {
        var t = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', t === 'dark');
      }
      applyTheme();
      window.addEventListener('storage', applyTheme);
    })();

    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: '/docs/openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: 'BaseLayout'
      });
    };
  </script>
</body>
</html>
